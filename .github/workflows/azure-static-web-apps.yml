name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Build static export
        run: corepack yarn build

      # This step is skipped (not failed) until the Azure Static Web Apps
      # resource exists and AZURE_STATIC_WEB_APPS_API_TOKEN is set as a repo
      # secret. Once the secret is added, deployment resumes automatically
      # on every push to main with no further changes to this file.
      - name: Deploy to Azure Static Web Apps
        if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          output_location: "out"
          skip_app_build: true

      - name: Deployment skipped (missing secret)
        if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN == '' }}
        run: |
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not set yet."
          echo "Build succeeded; deployment step was skipped on purpose."
          echo "Add the secret once the Azure Static Web Apps resource exists to enable automatic deployment."

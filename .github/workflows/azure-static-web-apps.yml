name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Build static export
        run: corepack yarn build

      - name: Verify static export
        run: |
          echo "=== Static export ==="
          ls -lah out

          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html was not generated"
            exit 1
          fi

          echo "Static export verified successfully."

      - name: Deploy to Azure Static Web Apps
        if: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          # IMPORTANT:
          # app_location points directly to the already-built
          # static application.
          app_location: "out"

          # No additional output directory because
          # app_location already contains the final files.
          output_location: ""

          # Do not let Azure/Oryx rebuild the Next.js application.
          skip_app_build: true

          # This application has no Azure Functions API.
          api_location: ""
          skip_api_build: true

          # Tell Azure this is a Next.js static export.
          is_static_export: true

      - name: Deployment skipped
        if: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN == '' }}
        run: |
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not set."
          echo "Build succeeded, but deployment was skipped."
